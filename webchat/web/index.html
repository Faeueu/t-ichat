<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Suporte T.I</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen" class="screen">
    <div class="login-box">
        <h1>Suporte T.I</h1>
        <p>Identifique-se para entrar</p>
        <input type="text" id="username-input" placeholder="Seu nome" maxlength="20" autofocus>

        <div class="role-choice">
            <label><input type="radio" name="role" value="COLABORADOR" checked> Colaborador</label>
            <label><input type="radio" name="role" value="TI"> Equipe de T.I</label>
        </div>

        <input type="password" id="password-input" class="hidden" placeholder="Senha da equipe de T.I">

        <button id="login-button">Entrar</button>
        <p id="login-error" class="error-text"></p>
    </div>
</div>

<div id="chat-screen" class="screen hidden">
    <aside id="sidebar">
        <div id="brand">Suporte T.I</div>
        <div id="me"></div>

        <div class="sidebar-section">
            <h2>Canais</h2>
            <ul id="room-list"></ul>
        </div>

        <div class="sidebar-section">
            <h2>Equipe de T.I</h2>
            <ul id="ti-list"></ul>
        </div>

        <div class="sidebar-section">
            <h2>Colaboradores</h2>
            <ul id="user-list"></ul>
        </div>
    </aside>

    <main id="chat-main">
        <header id="room-header">
            <span id="room-title">#</span>
        </header>

        <div id="private-indicator" class="hidden">
            Enviando mensagem privada para <strong id="private-target-name"></strong>
            <button id="cancel-private">cancelar</button>
        </div>

        <div id="message-log"></div>

        <form id="message-form">
            <input type="text" id="message-input" placeholder="Descreva o problema..." autocomplete="off">
            <button type="submit">Enviar</button>
        </form>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
